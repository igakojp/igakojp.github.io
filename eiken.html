<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eiken Quest: Aether - 4 Skills Mastery</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #00ffcc; --secondary: #7000ff; --accent: #ff0077;
            --gold: #ffcc00; --bg-deep: #05070a; --panel-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.2); --text-main: #e2e8f0;
            --skill-r: #4ade80; --skill-l: #60a5fa; --skill-w: #f472b6; --skill-s: #fbbf24;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-deep); color: var(--text-main); font-family: 'Noto Sans JP', sans-serif; overflow: hidden; display: flex; justify-content: center; }
        .app-shell { width: 100%; max-width: 500px; height: 100dvh; background: radial-gradient(circle at top, #101520, #020408); position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--border-glass); border-right: 1px solid var(--border-glass); }
        
        /* HUD */
        .nav-hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(0,0,0,0.8); z-index: 100; font-family: 'Orbitron'; border-bottom: 1px solid var(--border-glass);}
        .stat-badge { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 0.9rem; }
        .global-progress { width: 100%; height: 4px; background: #111; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.4s ease; box-shadow: 0 0 10px var(--primary);}
        
        /* Screens */
        .screen { flex: 1; padding: 20px; display: none; flex-direction: column; overflow-y: auto; }
        .screen.active { display: flex; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* UI Elements */
        .btn-core { background: var(--panel-glass); border: 1px solid var(--border-glass); color: white; padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; margin-bottom: 8px; font-weight: bold; transition: 0.2s; }
        .btn-core:active { transform: scale(0.95); background: rgba(0,255,204,0.1); border-color: var(--primary); }
        .grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Map Nodes */
        .map-grid { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 20px 0 100px; }
        .skill-node { width: 65px; height: 65px; border-radius: 50%; background: var(--panel-glass); border: 2px solid var(--border-glass); display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; position: relative; }
        .skill-node.unlocked { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .node-label { font-size: 0.6rem; margin-top: 2px; color: #888; }
        .unlocked .node-label { color: var(--primary); }

        /* Quiz UI */
        .quiz-card { background: rgba(10, 15, 25, 0.8); border: 1px solid var(--border-glass); border-radius: 20px; padding: 25px 20px; text-align: center; backdrop-filter: blur(10px); }
        .skill-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; font-family: 'Orbitron'; }
        
        .word-display { font-size: 1.2rem; font-weight: 700; margin: 10px 0 20px; line-height: 1.5; word-wrap: break-word; }
        .def-display { font-size: 0.9rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 25px; text-align: left; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; border-left: 3px solid var(--primary); }
        
        input[type="text"] { width: 100%; background: rgba(0,0,0,0.8); border: 2px solid var(--border-glass); border-radius: 12px; color: white; padding: 15px; font-size: 1.2rem; text-align: center; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        
        .mic-btn { width: 100%; padding: 18px; border-radius: 12px; background: linear-gradient(45deg, var(--accent), #ff5e62); border: none; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 5px 15px rgba(255,0,119,0.3); }
        .mic-btn.listening { animation: pulse 1s infinite; background: var(--gold); box-shadow: 0 5px 15px rgba(255,204,0,0.4); color: #000; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* Bottom Nav & Utils */
        .bottom-nav { height: 75px; background: rgba(2, 4, 8, 0.95); border-top: 1px solid var(--border-glass); display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
        .nav-btn { color: #475569; font-size: 1.3rem; cursor: pointer; text-align: center; flex: 1; transition: 0.3s; }
        .nav-btn span { display: block; font-size: 0.65rem; margin-top: 5px; font-weight: bold; }
        .nav-btn.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        #toast-container { position: fixed; top: 80px; width: 90%; max-width: 400px; z-index: 1000; pointer-events: none; left: 50%; transform: translateX(-50%); }
        .toast { padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: center; font-weight: bold; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="app-shell">
    <div class="nav-hud">
        <div class="hud-stats">
            <div class="stat-badge"><i class="fas fa-gem"></i> <span id="val-coins">0</span></div>
            <div class="stat-badge" id="hp-container"></div>
        </div>
        <div id="val-rank" style="font-size: 0.65rem; color: var(--primary); font-family: 'Orbitron'; letter-spacing: 1px;">SECTOR P1</div>
    </div>
    <div class="global-progress"><div id="main-progress" class="progress-fill"></div></div>

    <div id="scr-grade" class="screen active">
        <h3 style="text-align:center; font-family:'Orbitron'; margin-bottom: 5px;">TARGET LOCK</h3>
        <p style="text-align:center; font-size:0.75rem; color:#888; margin-bottom: 25px;">攻略する級（セクター）を選択</p>
        <div class="grade-grid">
            <div class="btn-core" onclick="setGrade('1')">1級 <span style="font-size:0.6rem;display:block;color:#888;">Master</span></div>
            <div class="btn-core" onclick="setGrade('P1')">準1級 <span style="font-size:0.6rem;display:block;color:#888;">Advanced</span></div>
            <div class="btn-core" onclick="setGrade('2')">2級 <span style="font-size:0.6rem;display:block;color:#888;">Upper Int.</span></div>
            <div class="btn-core" onclick="setGrade('P2')">準2級 <span style="font-size:0.6rem;display:block;color:#888;">Intermediate</span></div>
            <div class="btn-core" onclick="setGrade('3')">3級 <span style="font-size:0.6rem;display:block;color:#888;">Pre-Int.</span></div>
            <div class="btn-core" onclick="setGrade('4')">4級 <span style="font-size:0.6rem;display:block;color:#888;">Elementary</span></div>
            <div class="btn-core" style="grid-column: span 2;" onclick="setGrade('5')">5級 <span style="font-size:0.6rem;display:block;color:#888;">Beginner</span></div>
        </div>
    </div>

    <div id="scr-map" class="screen">
        <div style="text-align:center; margin-bottom: 10px;">
            <span id="map-grade-title" style="font-family:'Orbitron'; font-size:1.2rem; font-weight:bold; color:var(--primary);">GRADE X</span>
            <p style="font-size:0.7rem; color:#888;">レベルが上がるほど難易度とスキル要求が高くなります</p>
        </div>
        <div class="map-grid" id="map-container"></div>
    </div>

    <div id="scr-quiz" class="screen">
        <div class="quiz-card" id="quiz-main-card">
            <div id="skill-badge" class="skill-badge">ANALYZING...</div>
            
            <div id="display-main" class="word-display">...</div>
            <div id="display-sub" class="def-display"></div>
            
            <input type="text" id="ans-input" placeholder="答えを入力 (Enterで送信)" enterkeyhint="done" autocomplete="off">
            <button id="mic-trigger" class="mic-btn" style="display:none;" onclick="startSpeechRecognition()">
                <i class="fas fa-microphone"></i> タップして発音
            </button>
            <button id="audio-replay" class="btn-core" style="display:none; width:100%; margin-top:10px; background:var(--skill-l);" onclick="replayAudio()">
                <i class="fas fa-volume-up"></i> 音声をもう一度聴く
            </button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" onclick="nav('scr-grade', this)"><i class="fas fa-satellite"></i><span>TARGET</span></div>
        <div class="nav-btn" onclick="nav('scr-map', this)"><i class="fas fa-route"></i><span>MAP</span></div>
        <div class="nav-btn" onclick="emergencyReset()"><i class="fas fa-power-off"></i><span>RESET</span></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. THE EIKEN MASTER DATABASE (Progressive)
    // ==========================================
    // 各級ごとに難易度（difficulty: 1〜10）とスキル（R, L, W, S）を設定
    // 実際の試験に合わせた内容をオープンソース的に内包します。
    
    const EIKEN_DB = {
        '5': [
            { diff: 1, skill: "W", q: "I like ____. (りんご)", a: "apples", hint: "aから始まる複数形" },
            { diff: 2, skill: "L", text: "Hello, my name is Ken.", q: "聴こえた通りに入力してください", a: "hello, my name is ken." },
            { diff: 5, skill: "R", text: "My mother is a teacher. She works at a school.", q: "Where does she work?", a: "school", hint: "場所を表す単語" },
            { diff: 8, skill: "S", text: "I play tennis on Sundays.", q: "マイクに向かって読んでください", a: "play tennis" }
        ],
        '3': [
            { diff: 1, skill: "W", q: "She has ____ experiences. (様々な)", a: "various", hint: "vから始まる形容詞" },
            { diff: 3, skill: "L", text: "Could you tell me the way to the station?", q: "聴こえた通りに入力してください（カンマ不要）", a: "could you tell me the way to the station?" },
            { diff: 6, skill: "R", text: "Because of the heavy rain, the soccer game was canceled.", q: "Why was the game canceled? Because of the heavy ____.", a: "rain", hint: "天候を表す単語" },
            { diff: 9, skill: "S", text: "I want to visit Australia in the future.", q: "発音テスト: 画面の英文を読み上げてください", a: "australia" },
            { diff: 10, skill: "W", q: "It is ____ for us to learn history. (重要である)", a: "important", hint: "iから始まる形容詞" }
        ],
        'P1': [
            { diff: 1, skill: "W", q: "The company announced a ____ increase in profits. (著しい、かなりの)", a: "significant", hint: "sから始まる形容詞" },
            { diff: 2, skill: "W", q: "We must ____ the negative impacts of climate change. (和らげる、軽減する)", a: "mitigate", hint: "mから始まる動詞" },
            { diff: 4, skill: "L", text: "The unprecedented economic crisis fluctuated the market.", q: "ディクテーション: The [____] economic crisis...", a: "unprecedented", hint: "「前例のない」という意味の単語" },
            { diff: 7, skill: "R", text: "Despite initial skepticism, the alternative energy project yielded substantial benefits for the local ecosystem.", q: "What kind of benefits did the project yield?", a: "substantial", hint: "「実質的な、かなりの」という意味の単語" },
            { diff: 9, skill: "S", text: "The consequences of urban sprawl are deteriorating the environment.", q: "発音テスト: 流暢に読み上げてください", a: "consequences" },
            { diff: 10, skill: "R", text: "To alleviate traffic congestion, the city council implemented an ambiguous toll policy that exacerbated public dissatisfaction.", q: "What did the policy do to public dissatisfaction?", a: "exacerbated", hint: "「悪化させた」という意味の過去形動詞" }
        ]
        // ※データサイズ節約のため、1, 2, P2, 4級は今回はP1/3/5級のデータをフォールバックとして使用します。
    };

    // ==========================================
    // 2. STATE MANAGEMENT & PROGRESSION
    // ==========================================
    let state = JSON.parse(localStorage.getItem('aether4Skills')) || {
        coins: 0, unlockedLevels: { '1':1, 'P1':1, '2':1, 'P2':1, '3':1, '4':1, '5':1 }, 
        currentGrade: 'P1', hp: 3, progress: 0
    };
    
    let currentLevel = 1;
    let taskPool = [];
    let activeTask = null;
    let currentAudioText = "";

    function save() { localStorage.setItem('aether4Skills', JSON.stringify(state)); }

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (el) el.classList.add('active');
    }

    // ==========================================
    // 3. DYNAMIC LEVELING ALGORITHM
    // ==========================================
    function setGrade(g) {
        state.currentGrade = g;
        if (!state.unlockedLevels[g]) state.unlockedLevels[g] = 1;
        save();
        updateHUD();
        renderMap();
        nav('scr-map', document.querySelectorAll('.nav-btn')[1]);
    }

    function renderMap() {
        document.getElementById('map-grade-title').innerText = `GRADE ${state.currentGrade}`;
        const container = document.getElementById('map-container');
        container.innerHTML = "";
        
        const maxLevel = state.unlockedLevels[state.currentGrade] || 1;

        for (let i = 1; i <= 10; i++) {
            const node = document.createElement('div');
            const isUnlocked = i <= maxLevel;
            
            node.className = `skill-node ${isUnlocked ? 'unlocked' : 'locked'}`;
            if (isUnlocked) {
                node.innerHTML = `LV.${i} <span class="node-label">${getTierName(i)}</span>`;
                node.onclick = () => startMission(i);
            } else {
                node.innerHTML = `<i class="fas fa-lock" style="font-size:1.2rem; color:#444;"></i>`;
            }
            container.appendChild(node);
        }
    }

    function getTierName(lv) {
        if (lv <= 3) return "BASIC";
        if (lv <= 7) return "INTERMEDIATE";
        return "ADVANCED";
    }

    // ==========================================
    // 4. THE 4-SKILLS ENGINE
    // ==========================================
    function startMission(lv) {
        currentLevel = lv;
        state.hp = 3;
        state.progress = 0;
        updateHUD();
        
        // 難易度フィルター: 選択したレベルに近い難易度の問題を抽出
        const rawDB = EIKEN_DB[state.currentGrade] || EIKEN_DB['3']; // 未定義級は3級を代用
        
        // レベルアルゴリズム: Lv1ならdiff 1-3、Lv10ならdiff 8-10を中心に抽出
        taskPool = rawDB.filter(task => {
            const diffRange = Math.abs(task.diff - currentLevel);
            return diffRange <= 3; // レベルに近い問題をプールに入れる
        });

        // もし抽出できなければ全体を使う（フェイルセーフ）
        if (taskPool.length === 0) taskPool = [...rawDB];

        nav('scr-quiz');
        nextQuestion();
    }

    function nextQuestion() {
        if (state.progress >= 100) return finishMission();
        if (state.hp <= 0) return gameOver();

        // ランダムにタスクを選択
        activeTask = taskPool[Math.floor(Math.random() * taskPool.length)];

        const badge = document.getElementById('skill-badge');
        const main = document.getElementById('display-main');
        const sub = document.getElementById('display-sub');
        const input = document.getElementById('ans-input');
        const micBtn = document.getElementById('mic-trigger');
        const audioBtn = document.getElementById('audio-replay');

        input.value = "";
        input.style.display = "block";
        micBtn.style.display = "none";
        audioBtn.style.display = "none";
        micBtn.classList.remove('listening');
        input.placeholder = "答えを入力してEnter";

        // スキルごとのUI構築
        switch(activeTask.skill) {
            case "R":
                badge.innerText = "📖 READING (読解)";
                badge.style.background = varColor('--skill-r');
                badge.style.color = "#000";
                main.innerHTML = `<div style="font-size:1rem; font-weight:normal; text-align:left;">${activeTask.text}</div>`;
                sub.innerHTML = `<strong>Q:</strong> ${activeTask.q}<br><span style="color:var(--gold); font-size:0.8rem;">Hint: ${activeTask.hint}</span>`;
                break;
                
            case "L":
                badge.innerText = "🎧 LISTENING (聴解)";
                badge.style.background = varColor('--skill-l');
                badge.style.color = "#000";
                main.innerHTML = `<i class="fas fa-headphones-alt" style="font-size:2rem; color:var(--skill-l);"></i>`;
                sub.innerHTML = `<strong>Q:</strong> ${activeTask.q}<br><span style="color:var(--gold); font-size:0.8rem;">Hint: ${activeTask.hint || "音声を聴いて入力"}</span>`;
                audioBtn.style.display = "block";
                currentAudioText = activeTask.text;
                setTimeout(replayAudio, 500); // 0.5秒後に自動再生
                break;
                
            case "W":
                badge.innerText = "✍️ WRITING (語彙・文法)";
                badge.style.background = varColor('--skill-w');
                badge.style.color = "#000";
                main.innerHTML = "Fill in the blank";
                sub.innerHTML = `<strong>Q:</strong> ${activeTask.q}<br><span style="color:var(--gold); font-size:0.8rem;">Hint: ${activeTask.hint}</span>`;
                break;
                
            case "S":
                badge.innerText = "🗣️ SPEAKING (発音・音読)";
                badge.style.background = varColor('--skill-s');
                badge.style.color = "#000";
                main.innerHTML = `<div style="font-size:1.1rem; color:#fff;">"${activeTask.text}"</div>`;
                sub.innerHTML = `<strong>Task:</strong> ${activeTask.q}`;
                input.style.display = "none";
                micBtn.style.display = "block";
                break;
        }
        
        if (activeTask.skill !== "S") input.focus();
    }

    // ==========================================
    // 5. INPUT & VALIDATION
    // ==========================================
    document.getElementById('ans-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkTextAnswer();
    });

    function checkTextAnswer() {
        if (!activeTask) return;
        const userAns = document.getElementById('ans-input').value.trim().toLowerCase();
        // 句読点などを除去して判定を緩くする
        const cleanUser = userAns.replace(/[.,!?]/g, '');
        const cleanAns = activeTask.a.toLowerCase().replace(/[.,!?]/g, '');
        
        if (cleanUser === cleanAns || cleanUser.includes(cleanAns)) {
            success();
        } else {
            fail();
        }
    }

    function success() {
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 }, colors: ['#00ffcc', '#7000ff'] });
        state.progress += 25; // 4問正解でクリア
        state.coins += (currentLevel * 10);
        showToast("EXCELLENT!", false);
        updateHUD();
        setTimeout(nextQuestion, 800);
    }

    function fail() {
        state.hp--;
        updateHUD();
        const card = document.getElementById('quiz-main-card');
        card.classList.add('animate__animated', 'animate__headShake');
        showToast(`MISS: 正解は "${activeTask.a}"`, true);
        
        setTimeout(() => {
            card.classList.remove('animate__animated', 'animate__headShake');
            if (state.hp <= 0) gameOver();
            else nextQuestion(); // 失敗しても次の問題へ（本番試験風）
        }, 1500);
    }

    // ==========================================
    // 6. HARDWARE APIs (Speech & TTS)
    // ==========================================
    function replayAudio() {
        const u = new SpeechSynthesisUtterance(currentAudioText);
        u.lang = 'en-US';
        u.rate = 0.85; // リスニング用に少しだけゆっくり
        window.speechSynthesis.speak(u);
    }

    function startSpeechRecognition() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
            showToast("お使いのブラウザはマイク入力に未対応です", true);
            success(); // 進行不能を防ぐためスキップ
            return;
        }
        
        const rec = new Speech();
        rec.lang = 'en-US';
        const micBtn = document.getElementById('mic-trigger');
        
        micBtn.classList.add('listening');
        micBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 音声認識中...';
        
        rec.start();
        
        rec.onresult = (e) => {
            micBtn.classList.remove('listening');
            micBtn.innerHTML = '<i class="fas fa-microphone"></i> タップして発音';
            const transcript = e.results[0][0].transcript.toLowerCase();
            
            // 判定: 要求されたキーワード（activeTask.a）が含まれていればOK
            if (transcript.includes(activeTask.a.toLowerCase())) {
                success();
            } else {
                fail();
            }
        };
        
        rec.onerror = () => {
            micBtn.classList.remove('listening');
            micBtn.innerHTML = '<i class="fas fa-microphone"></i> エラー発生。再試行';
            showToast("音声を認識できませんでした", true);
        };
    }

    // ==========================================
    // 7. UTILITIES
    // ==========================================
    function showToast(msg, isErr) {
        const t = document.createElement('div');
        t.className = 'toast animate__animated animate__fadeInDown';
        t.style.background = isErr ? 'rgba(255,0,119,0.9)' : 'rgba(0,255,204,0.9)';
        t.style.color = isErr ? '#fff' : '#000';
        t.innerText = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => {
            t.classList.replace('animate__fadeInDown', 'animate__fadeOutUp');
            setTimeout(() => t.remove(), 500);
        }, 2000);
    }

    function updateHUD() {
        document.getElementById('val-coins').innerText = state.coins;
        document.getElementById('hp-container').innerHTML = "❤".repeat(Math.max(0, state.hp));
        document.getElementById('main-progress').style.width = (state.progress || 0) + "%";
        document.getElementById('val-rank').innerText = `SECTOR ${state.currentGrade}`;
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function finishMission() {
        showToast("MISSION CLEAR! セクター制圧", false);
        
        // 次のレベルを解放
        const currentMax = state.unlockedLevels[state.currentGrade];
        if (currentLevel === currentMax && currentMax < 10) {
            state.unlockedLevels[state.currentGrade]++;
        }
        
        save();
        renderMap();
        setTimeout(() => nav('scr-map'), 1500);
    }

    function gameOver() {
        showToast("SYSTEM FAILURE: ライフが尽きました", true);
        setTimeout(() => nav('scr-map'), 2000);
    }

    function emergencyReset() {
        if(confirm("全ての進行状況をリセットしますか？")) {
            localStorage.removeItem('aether4Skills');
            location.reload();
        }
    }

    window.onload = () => {
        updateHUD();
        // 初期状態は画面1を表示
    };
</script>
</body>
</html>
