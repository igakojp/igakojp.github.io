<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Quest: Aether - Ultimate Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;900&family=MuseoModerno:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #00ffcc; /* Aether Neon */
            --secondary: #7000ff;
            --accent: #ff0077;
            --gold: #ffcc00;
            --bg-deep: #05070a;
            --panel-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #e2e8f0;
        }

        /* Base Setup */
        * { box-sizing: border-box; outline: none; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0; overflow: hidden; height: 100vh;
            display: flex; justify-content: center;
        }

        /* App Container */
        .app-shell {
            width: 100%; max-width: 480px; height: 100vh;
            background: radial-gradient(circle at top, #101520, #05070a);
            position: relative; border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            display: flex; flex-direction: column;
        }

        /* Top Navigation HUD */
        .nav-hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--border-glass); z-index: 100;
            font-family: 'Orbitron', sans-serif;
        }
        .hud-stats { display: flex; gap: 15px; }
        .stat-badge { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .stat-badge i { color: var(--gold); }

        /* Progress Bar Area */
        .global-progress { width: 100%; height: 5px; background: #111; position: relative; }
        .progress-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary));
            box-shadow: 0 0 10px var(--primary); transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Screen Management */
        .screen {
            position: absolute; inset: 0; top: 60px; /* HUDの下から */
            padding: 20px; display: none; flex-direction: column; overflow-y: auto;
        }
        .screen.active { display: flex; }

        /* Map & Skill Tree */
        .map-grid { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 0 150px; }
        .skill-node {
            width: 85px; height: 85px; border-radius: 50%; background: var(--panel-glass);
            border: 3px solid var(--border-glass); display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s ease; position: relative;
        }
        .skill-node.unlocked { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
        .skill-node.current { transform: scale(1.15); border-color: var(--gold); box-shadow: 0 0 25px rgba(255, 204, 0, 0.5); }
        .skill-node.locked { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }
        .node-icon { font-size: 1.8rem; margin-bottom: 2px; }
        .node-label { font-family: 'Orbitron'; font-size: 0.7rem; font-weight: bold; }

        /* Quiz UI Elements */
        .quiz-card {
            background: var(--panel-glass); border: 1px solid var(--border-glass);
            border-radius: 25px; padding: 25px; text-align: center; margin-top: 20px;
            backdrop-filter: blur(10px);
        }
        .q-type-label {
            display: inline-block; padding: 4px 12px; border-radius: 10px;
            font-size: 0.75rem; font-weight: bold; background: var(--secondary); margin-bottom: 15px;
        }
        .word-display { font-size: 2.2rem; font-weight: 900; margin: 20px 0; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .def-display { font-size: 1rem; color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }

        input[type="text"] {
            width: 100%; background: rgba(0,0,0,0.5); border: 2px solid var(--border-glass);
            border-radius: 15px; color: white; padding: 18px; font-size: 1.3rem;
            text-align: center; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }

        /* Shop & Inventory */
        .shop-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .item-card {
            background: var(--panel-glass); border: 1px solid var(--border-glass);
            border-radius: 20px; padding: 15px; text-align: center; transition: 0.3s;
        }
        .item-card:hover { border-color: var(--primary); }
        .item-price { color: var(--gold); font-weight: bold; font-family: 'Orbitron'; margin-top: 10px; }

        /* Footer Menu */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 75px;
            background: rgba(10, 15, 25, 0.9); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-btn { color: #64748b; font-size: 1.4rem; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--primary); }

        /* Loading Overlay */
        #loader {
            position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid var(--panel-glass);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 20px; font-family: 'Orbitron'; letter-spacing: 2px;">SYNCING AETHER DATA...</p>
</div>

<div class="app-shell">
    <div class="nav-hud">
        <div class="hud-stats">
            <div class="stat-badge"><i class="fas fa-gem"></i> <span id="val-coins">0</span></div>
            <div class="stat-badge"><i class="fas fa-fire"></i> <span id="val-streak">0</span></div>
        </div>
        <div id="val-rank" style="font-size: 0.8rem; color: var(--primary);">EXPERT LV.1</div>
    </div>
    <div class="global-progress"><div id="main-progress" class="progress-fill"></div></div>

    <div id="scr-map" class="screen active">
        <div class="map-grid" id="map-container"></div>
    </div>

    <div id="scr-quiz" class="screen">
        <div class="quiz-card animate__animated animate__zoomIn">
            <div id="quiz-type" class="q-type-label">READING</div>
            <div id="timer-text" style="font-family: 'Orbitron'; font-size: 0.9rem; color: var(--accent);">15s</div>
            <div id="display-main" class="word-display">TargetWord</div>
            <div id="display-sub" class="def-display">Definition goes here...</div>
            <input type="text" id="ans-input" placeholder="答えを入力...">
            <button id="mic-trigger" class="skill-node" style="width: 100%; border-radius: 15px; height: 60px; margin-top: 15px; display: none; background: var(--accent);">
                <i class="fas fa-microphone"></i>
            </button>
        </div>
    </div>

    <div id="scr-shop" class="screen">
        <h2 style="font-family: 'Orbitron'; text-align: center;">AETHER SHOP</h2>
        <div class="shop-list" id="shop-container">
            </div>
    </div>

    <div class="bottom-nav">
        <i class="fas fa-map-marked-alt nav-btn active" onclick="nav('scr-map', this)"></i>
        <i class="fas fa-shopping-cart nav-btn" onclick="nav('scr-shop', this)"></i>
        <i class="fas fa-user-circle nav-btn" onclick="nav('scr-profile', this)"></i>
    </div>
</div>

<script>
    // --- 構成データ & 定数 ---
    const CONFIG = {
        baseWords: ["significant", "consequence", "alternative", "substantial", "prohibit", "adequate", "perspective", "vulnerable", "prevalent", "ambiguous", "incentive", "implement", "sustainable", "feasible", "precisely"],
        modes: ["READING", "LISTENING", "SPEAKING", "WRITING"],
        items: [
            { id: 'fire', name: 'Fire Aura', price: 100, icon: '🔥' },
            { id: 'ice', name: 'Ice Shield', price: 250, icon: '❄️' },
            { id: 'bolt', name: 'Thunder Stick', price: 500, icon: '⚡' },
            { id: 'crown', name: 'Master Crown', price: 1000, icon: '👑' }
        ]
    };

    // --- ゲーム状態 (LocalStorage連携) ---
    let state = JSON.parse(localStorage.getItem('eikenAetherSave')) || {
        coins: 0, streak: 0, unlocked: 1, currentLv: 1, progress: 0,
        inventory: [], lastLogin: ""
    };

    let wordPool = [];
    let currentTask = null;
    let timerId = null;

    // --- 初期化処理 ---
    async function initAether() {
        const loaderMsg = document.querySelector('#loader p');
        
        // 1. APIからデータをフェッチ
        for (let word of CONFIG.baseWords) {
            loaderMsg.innerText = `FETCHING: ${word}...`;
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                const data = await res.json();
                if (data[0]) {
                    wordPool.push({
                        word: word,
                        def: data[0].meanings[0].definitions[0].definition,
                        audio: data[0].phonetics.find(p => p.audio)?.audio || ""
                    });
                }
            } catch (e) { console.warn("API Fetch Error"); }
        }

        // 2. UI反映
        updateHUD();
        renderMap();
        renderShop();
        
        // 3. ローダー解除
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
        }, 800);
    }

    // --- 画面ナビゲーション ---
    function nav(screenId, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (el) el.classList.add('active');
    }

    // --- マップ生成 ---
    function renderMap() {
        const container = document.getElementById('map-container');
        container.innerHTML = "";
        for (let i = 1; i <= 20; i++) {
            const node = document.createElement('div');
            const isUnlocked = i <= state.unlocked;
            const isCurrent = i === state.unlocked;
            
            node.className = `skill-node ${isUnlocked ? 'unlocked' : 'locked'} ${isCurrent ? 'current' : ''}`;
            node.innerHTML = `
                <div class="node-icon"><i class="fas ${isUnlocked ? 'fa-bolt' : 'fa-lock'}"></i></div>
                <div class="node-label">LV.${i}</div>
            `;
            if (isUnlocked) node.onclick = () => startMission(i);
            container.appendChild(node);
        }
    }

    // --- ミッション開始 ---
    function startMission(lv) {
        state.currentLv = lv;
        state.progress = 0;
        updateProgress();
        nav('scr-quiz');
        nextQuestion();
    }

    // --- クイズロジック ---
    function nextQuestion() {
        if (state.progress >= 100) return finishMission();
        
        clearInterval(timerId);
        currentTask = wordPool[Math.floor(Math.random() * wordPool.length)];
        const mode = CONFIG.modes[Math.floor(Math.random() * CONFIG.modes.length)];
        
        document.getElementById('quiz-type').innerText = mode;
        document.getElementById('ans-input').value = "";
        document.getElementById('ans-input').style.display = "block";
        document.getElementById('mic-trigger').style.display = "none";
        
        const main = document.getElementById('display-main');
        const sub = document.getElementById('display-sub');

        if (mode === "READING") {
            main.innerText = "Translate Def";
            sub.innerText = currentTask.def;
        } else if (mode === "LISTENING") {
            main.innerText = "👂 Listen...";
            sub.innerText = "Type the word you hear";
            playTTS(currentTask.word);
        } else if (mode === "WRITING") {
            const hint = currentTask.word.charAt(0) + "_".repeat(currentTask.word.length - 2) + currentTask.word.slice(-1);
            main.innerText = hint;
            sub.innerText = currentTask.def;
        } else if (mode === "SPEAKING") {
            main.innerText = currentTask.word;
            sub.innerText = "Pronounce clearly";
            document.getElementById('ans-input').style.display = "none";
            document.getElementById('mic-trigger').style.display = "flex";
            setupSpeech();
        }

        startTimer();
    }

    function startTimer() {
        let sec = 15;
        document.getElementById('timer-text').innerText = sec + "s";
        timerId = setInterval(() => {
            sec--;
            document.getElementById('timer-text').innerText = sec + "s";
            if (sec <= 0) {
                clearInterval(timerId);
                alert("TIME OVER! Answer: " + currentTask.word);
                nextQuestion();
            }
        }, 1000);
    }

    // --- 判定アルゴリズム ---
    document.getElementById('ans-input').oninput = function() {
        if (this.value.toLowerCase() === currentTask.word.toLowerCase()) {
            handleSuccess();
        }
    };

    function handleSuccess() {
        clearInterval(timerId);
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        
        state.progress += 25;
        state.coins += 20;
        updateProgress();
        updateHUD();
        save();
        
        setTimeout(nextQuestion, 1000);
    }

    function finishMission() {
        alert("MISSION CLEAR! 💎 +100");
        state.coins += 100;
        if (state.currentLv === state.unlocked) state.unlocked++;
        state.streak++;
        save();
        renderMap();
        nav('scr-map');
    }

    // --- 音声認識 & 合成 ---
    function playTTS(text) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.8;
        speechSynthesis.speak(u);
    }

    function setupSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        const rec = new Speech();
        rec.lang = 'en-US';
        
        document.getElementById('mic-trigger').onclick = () => {
            rec.start();
            document.getElementById('mic-trigger').style.background = "#ffcc00";
        };
        
        rec.onresult = (e) => {
            const result = e.results[0][0].transcript.toLowerCase();
            document.getElementById('mic-trigger').style.background = "var(--accent)";
            if (result.includes(currentTask.word.toLowerCase())) {
                handleSuccess();
            } else {
                alert(`Heard: "${result}". Try again!`);
            }
        };
    }

    // --- ショップ機能 ---
    function renderShop() {
        const container = document.getElementById('shop-container');
        container.innerHTML = "";
        CONFIG.items.forEach(item => {
            const isOwned = state.inventory.includes(item.id);
            const card = document.createElement('div');
            card.className = "item-card";
            card.innerHTML = `
                <div style="font-size: 2rem;">${item.icon}</div>
                <div style="font-weight: bold; margin-top:5px;">${item.name}</div>
                <div class="item-price">${isOwned ? 'OWNED' : item.price + ' 💎'}</div>
                <button class="btn-main" style="width:100%; margin-top:10px; padding:5px; font-size:0.7rem;" 
                    onclick="buyItem('${item.id}', ${item.price})" ${isOwned ? 'disabled' : ''}>
                    ${isOwned ? 'EQUIPPED' : 'BUY'}
                </button>
            `;
            container.appendChild(card);
        });
    }

    function buyItem(id, price) {
        if (state.coins >= price) {
            state.coins -= price;
            state.inventory.push(id);
            save();
            updateHUD();
            renderShop();
            alert("ITEM ACQUIRED!");
        } else {
            alert("NOT ENOUGH GEMS!");
        }
    }

    // --- ユーティリティ ---
    function updateHUD() {
        document.getElementById('val-coins').innerText = state.coins;
        document.getElementById('val-streak').innerText = state.streak;
        document.getElementById('val-rank').innerText = `PILOT LV.${state.unlocked}`;
    }

    function updateProgress() {
        document.getElementById('main-progress').style.width = state.progress + "%";
    }

    function save() {
        localStorage.setItem('eikenAetherSave', JSON.stringify(state));
    }

    // エントリーポイント
    window.onload = initAether;
</script>
</body>
</html>
