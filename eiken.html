<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Quest: Aether - Genesis</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #7000ff;
            --accent: #ff0077;
            --gold: #ffcc00;
            --bg-deep: #05070a;
            --panel-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #e2e8f0;
        }

        * { box-sizing: border-box; outline: none; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0; overflow: hidden; height: 100vh;
            display: flex; justify-content: center;
        }

        .app-shell {
            width: 100%; max-width: 480px; height: 100vh;
            background: radial-gradient(circle at top, #101520, #05070a);
            position: relative; border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            display: flex; flex-direction: column;
        }

        /* HUD (上部情報バー) */
        .nav-hud {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.6);
            border-bottom: 1px solid var(--border-glass); z-index: 100;
            font-family: 'Orbitron', sans-serif;
        }
        .hud-stats { display: flex; gap: 12px; }
        .stat-badge { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 0.9rem;}
        .stat-badge i.fa-gem { color: var(--primary); }
        .stat-badge i.fa-heart { color: var(--accent); }

        .global-progress { width: 100%; height: 4px; background: #111; }
        .progress-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary));
            box-shadow: 0 0 10px var(--primary); transition: width 0.4s ease;
        }

        /* 画面システム */
        .screen {
            position: absolute; inset: 0; top: 65px; bottom: 75px;
            padding: 20px; display: none; flex-direction: column; overflow-y: auto;
        }
        .screen.active { display: flex; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 級選択 */
        .grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grade-card {
            background: var(--panel-glass); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 15px; text-align: center; cursor: pointer;
            transition: 0.2s; font-family: 'Orbitron'; font-size: 0.9rem;
        }
        .grade-card:hover { border-color: var(--primary); background: rgba(0,255,204,0.1); }

        /* マップ */
        .map-grid { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 20px 0 100px; }
        .skill-node {
            width: 65px; height: 65px; border-radius: 50%; background: var(--panel-glass);
            border: 3px solid var(--border-glass); display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; font-weight: bold;
        }
        .skill-node.unlocked { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .skill-node.locked { opacity: 0.2; cursor: not-allowed; }

        /* クイズUI */
        .quiz-card {
            background: var(--panel-glass); border: 1px solid var(--border-glass);
            border-radius: 20px; padding: 25px; text-align: center; backdrop-filter: blur(10px);
        }
        .bot-console { font-family: 'Orbitron'; font-size: 0.6rem; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; }
        .word-display { font-size: 1.6rem; font-weight: 900; margin: 15px 0; color: #fff; text-shadow: 0 0 10px var(--primary); line-height: 1.4; }
        .def-display { font-size: 0.9rem; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; min-height: 50px; text-align: left; }
        
        input[type="text"] {
            width: 100%; background: rgba(0,0,0,0.5); border: 2px solid var(--border-glass);
            border-radius: 12px; color: white; padding: 15px; font-size: 1.2rem; text-align: center;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        /* トースト */
        #toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none; }
        .toast { padding: 10px 20px; border-radius: 20px; margin-bottom: 8px; font-weight: bold; font-family: 'Noto Sans JP'; animation: slideInDown 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* 下部ナビ */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 75px;
            background: rgba(5, 7, 10, 0.9); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-btn { color: #475569; font-size: 1.3rem; cursor: pointer; transition: 0.3s; text-align: center; }
        .nav-btn span { display: block; font-size: 0.6rem; margin-top: 4px; font-weight: bold; }
        .nav-btn.active { color: var(--primary); }

        #loader { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loader">
    <div class="animate__animated animate__pulse animate__infinite" style="color:var(--primary); font-size:2.5rem;"><i class="fas fa-brain"></i></div>
    <p id="loader-text" style="margin-top:15px; font-family: 'Orbitron'; font-size:0.8rem; letter-spacing: 2px;">SYNCING AETHER BOT...</p>
</div>

<div id="toast-container"></div>

<div class="app-shell">
    <div class="nav-hud">
        <div class="hud-stats">
            <div class="stat-badge"><i class="fas fa-gem"></i> <span id="val-coins">0</span></div>
            <div class="stat-badge"><i class="fas fa-heart"></i> <span id="val-hp">3</span></div>
        </div>
        <div id="val-rank" style="font-size: 0.7rem; color: var(--primary); font-family: 'Orbitron';">RECRUIT LV.1</div>
    </div>
    <div class="global-progress"><div id="main-progress" class="progress-fill"></div></div>

    <div id="scr-grade" class="screen active">
        <h3 style="font-family:'Orbitron'; text-align:center; letter-spacing: 2px;">SECTOR SELECT</h3>
        <p style="text-align:center; font-size:0.7rem; color:var(--primary); margin-bottom:20px;">挑戦する級を選択してください</p>
        <div class="grade-grid">
            <div class="grade-card" onclick="setGrade('1')">1級</div>
            <div class="grade-card" onclick="setGrade('P1')">準1級</div>
            <div class="grade-card" onclick="setGrade('2')">2級</div>
            <div class="grade-card" onclick="setGrade('P2')">準2級</div>
            <div class="grade-card" onclick="setGrade('3')">3級</div>
            <div class="grade-card" onclick="setGrade('4')">4級</div>
            <div class="grade-card" onclick="setGrade('5')">5級</div>
        </div>
        <button onclick="emergencyReset()" style="margin-top:40px; background:none; border:1px solid #333; color:#555; font-size:0.6rem; padding:10px; border-radius:5px; cursor:pointer; width:100%;">全データの初期化 (EMERGENCY RESET)</button>
    </div>

    <div id="scr-map" class="screen">
        <div class="map-grid" id="map-container"></div>
    </div>

    <div id="scr-quiz" class="screen">
        <div class="quiz-card" id="quiz-main-card">
            <div id="bot-status" class="bot-console">[ 分析中... ]</div>
            <div id="display-main" class="word-display">準備完了</div>
            <div id="display-sub" class="def-display">タスクをロードしています...</div>
            <input type="text" id="ans-input" placeholder="答えを入力してEnter..." autocomplete="off">
            <button id="mic-trigger" style="width:100%; height:50px; border-radius:12px; margin-top:10px; display:none; background:var(--accent); border:none; color:white; font-weight:bold; cursor:pointer;">
                <i class="fas fa-microphone"></i> 話してください
            </button>
        </div>
        <div id="combo-tag" style="text-align:center; margin-top:15px; font-family:'Orbitron'; color:var(--gold); font-weight:bold;"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" onclick="nav('scr-grade', this)"><i class="fas fa-layer-group"></i><span>級選択</span></div>
        <div class="nav-btn" onclick="nav('scr-map', this)"><i class="fas fa-map-marked-alt"></i><span>マップ</span></div>
        <div class="nav-btn"><i class="fas fa-shopping-cart"></i><span>ショップ</span></div>
    </div>
</div>

<script>
    // --- データ & ボットの記憶 ---
    const VOCAB_DATA = {
        '1': [
            {w: "ambiguous", d: "あいまいで、複数の解釈ができること"},
            {w: "mitigate", d: "（苦痛や損害などを）和らげる、軽減する"},
            {w: "alleviate", d: "（苦痛や問題を）軽くする、緩和する"}
        ],
        'P1': [
            {w: "significant", d: "重要な、かなりの、意味のある"},
            {w: "consequence", d: "（必然的な）結果、影響"},
            {w: "substantial", d: "かなりの、実質的な、相当な"}
        ],
        '2': [
            {w: "environment", d: "自然環境、周囲の状況"},
            {w: "opportunity", d: "（良い）機会、チャンス"},
            {w: "benefit", d: "利益、恩恵、利点"}
        ],
        '3': [
            {w: "difficult", d: "難しい、困難な"},
            {w: "experience", d: "経験、体験"},
            {w: "various", d: "さまざまな、多様な"}
        ]
    };

    // 長文・穴埋め用データ
    const SCENARIOS = [
        {
            type: "READING",
            text: "Solar energy is becoming more popular because it is sustainable. Unlike coal, it does not release harmful gases into the atmosphere.",
            q: "Why is solar energy popular?",
            a: "sustainable",
            hint: "答えは文中の形容詞です"
        },
        {
            type: "CLOZE",
            text: "The scientist decided to ____ the experiment to ensure the results were accurate.",
            q: "空欄に入る適切な単語は？",
            a: "repeat",
            hint: "何度も行うこと"
        },
        {
            type: "READING",
            text: "Many people prefer remote work to save time. However, some feel lonely without meeting colleagues in person.",
            q: "What is a disadvantage of remote work mentioned?",
            a: "lonely",
            hint: "感情を表す言葉です"
        }
    ];

    let state = JSON.parse(localStorage.getItem('eikenAetherFull')) || {
        coins: 0, unlocked: 1, grade: 'P1', hp: 3, fails: {}, combo: 0, progress: 0
    };

    let wordPool = [];
    let currentTask = null;

    // --- ナビゲーション ---
    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (el) el.classList.add('active');
    }

    async function setGrade(g) {
        state.grade = g;
        save();
        await loadGradeData(g);
        nav('scr-map', document.querySelectorAll('.nav-btn')[1]);
    }

    async function loadGradeData(g) {
        document.getElementById('loader').style.display = 'flex';
        const basicWords = VOCAB_DATA[g] || VOCAB_DATA['P1'];
        wordPool = [];
        
        // 単語データの構築
        for (let item of basicWords) {
            wordPool.push({
                word: item.w,
                def: item.d,
                type: "VOCAB",
                fails: state.fails[item.w] || 0
            });
        }
        
        // シナリオデータの統合
        SCENARIOS.forEach(s => wordPool.push({...s, word: s.a, fails: state.fails[s.a] || 0}));
        
        renderMap();
        document.getElementById('loader').style.display = 'none';
    }

    function renderMap() {
        const container = document.getElementById('map-container');
        container.innerHTML = "";
        for (let i = 1; i <= 10; i++) {
            const node = document.createElement('div');
            const unlocked = i <= state.unlocked;
            node.className = `skill-node ${unlocked ? 'unlocked' : 'locked'}`;
            node.innerHTML = unlocked ? i : '<i class="fas fa-lock" style="font-size:0.7rem"></i>';
            if (unlocked) node.onclick = () => startMission(i);
            container.appendChild(node);
        }
    }

    // --- ミッション制御 ---
    function startMission(lv) {
        state.hp = 3;
        state.progress = 0;
        state.combo = 0;
        updateHUD();
        nav('scr-quiz');
        nextQuestion();
    }

    function nextQuestion() {
        if (state.progress >= 100) return finishMission();
        if (state.hp <= 0) return gameOver();

        // ボットの思考: 苦手な問題を優先
        wordPool.sort((a, b) => (state.fails[b.word] || 0) - (state.fails[a.word] || 0));
        const isWeakness = Math.random() > 0.4 && wordPool[0].fails > 0;
        currentTask = isWeakness ? wordPool[0] : wordPool[Math.floor(Math.random() * wordPool.length)];

        document.getElementById('bot-status').innerText = isWeakness ? "[ 弱点補強モード稼働中 ]" : "[ 新規パターンをスキャン中 ]";
        document.getElementById('combo-tag').innerText = state.combo > 1 ? `${state.combo} COMBO!` : "";

        const input = document.getElementById('ans-input');
        input.value = "";
        
        const main = document.getElementById('display-main');
        const sub = document.getElementById('display-sub');
        const mic = document.getElementById('mic-trigger');

        mic.style.display = "none";
        input.style.display = "block";

        // 出題タイプの切り替え
        const mode = currentTask.type || "VOCAB";

        if (mode === "READING") {
            main.innerHTML = `<span style="font-size:1rem; color:var(--primary);">【長文読解】</span><br>${currentTask.text}`;
            sub.innerHTML = `<strong>問:</strong> ${currentTask.q}<br><small style="color:var(--gold)">ヒント: ${currentTask.hint}</small>`;
        } else if (mode === "CLOZE") {
            main.innerHTML = `<span style="font-size:1rem; color:var(--primary);">【穴埋め】</span><br>${currentTask.text}`;
            sub.innerHTML = `<strong>問:</strong> ${currentTask.q}<br><small style="color:var(--gold)">ヒント: ${currentTask.hint}</small>`;
        } else {
            // 通常の単語問題
            const subModes = ["DECODE", "LISTEN", "SPEAK"];
            const sm = subModes[Math.floor(Math.random() * subModes.length)];
            
            if (sm === "DECODE") {
                main.innerText = "単語を特定せよ";
                sub.innerText = currentTask.def;
            } else if (sm === "LISTEN") {
                main.innerHTML = `<i class="fas fa-volume-up"></i> 音声を聴け`;
                sub.innerText = "聴こえた単語をスペルアウトしてください";
                playTTS(currentTask.word);
            } else if (sm === "SPEAK") {
                main.innerText = currentTask.word;
                sub.innerText = "マイクに向かって発音してください";
                input.style.display = "none";
                mic.style.display = "block";
                setupSpeech();
            }
        }
        input.focus();
    }

    // --- 判定とフィードバック ---
    document.getElementById('ans-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    function checkAnswer() {
        const val = document.getElementById('ans-input').value.trim().toLowerCase();
        if (val === currentTask.word.toLowerCase()) handleSuccess();
        else handleFailure();
    }

    function handleSuccess() {
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
        state.combo++;
        state.progress += 25;
        state.coins += (10 + state.combo * 2);
        if (state.fails[currentTask.word] > 0) state.fails[currentTask.word]--;
        
        showToast("正解！パーフェクトだ。", false);
        updateHUD();
        save();
        setTimeout(nextQuestion, 700);
    }

    function handleFailure() {
        state.hp--;
        state.combo = 0;
        state.fails[currentTask.word] = (state.fails[currentTask.word] || 0) + 1;
        
        updateHUD();
        showToast(`不正解。正解は: ${currentTask.word}`, true);
        const card = document.getElementById('quiz-main-card');
        card.classList.add('animate__animated', 'animate__headShake');
        
        setTimeout(() => {
            card.classList.remove('animate__animated', 'animate__headShake');
            if (state.hp <= 0) gameOver();
            else nextQuestion();
        }, 1000);
    }

    // --- システム関数 ---
    function showToast(msg, isErr) {
        const t = document.createElement('div');
        t.className = 'toast animate__animated animate__fadeInDown';
        t.style.background = isErr ? 'var(--accent)' : 'var(--primary)';
        t.style.color = isErr ? '#fff' : '#000';
        t.innerText = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function setupSpeech() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        const rec = new Speech();
        rec.lang = 'en-US';
        document.getElementById('mic-trigger').onclick = () => {
            rec.start();
            document.getElementById('mic-trigger').style.background = "var(--gold)";
        };
        rec.onresult = (e) => {
            document.getElementById('mic-trigger').style.background = "var(--accent)";
            if (e.results[0][0].transcript.toLowerCase().includes(currentTask.word.toLowerCase())) handleSuccess();
            else handleFailure();
        };
    }

    function playTTS(t) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'en-US';
        speechSynthesis.speak(u);
    }

    function updateHUD() {
        document.getElementById('val-coins').innerText = state.coins;
        document.getElementById('val-hp').innerText = "❤".repeat(Math.max(0, state.hp));
        document.getElementById('main-progress').style.width = state.progress + "%";
        const ranks = ["訓練兵", "偵察兵", "操縦士", "精鋭エージェント", "マスター"];
        const rIndex = Math.min(Math.floor(state.unlocked / 2), 4);
        document.getElementById('val-rank').innerText = `${ranks[rIndex]} LV.${state.unlocked}`;
    }

    function finishMission() {
        showToast("ミッション完了！ボーナス獲得。", false);
        state.coins += 100;
        if (state.unlocked < 10) state.unlocked++;
        save();
        renderMap();
        setTimeout(() => nav('scr-map'), 1500);
    }

    function gameOver() {
        showToast("HPが尽きた。マップへ撤退する。", true);
        setTimeout(() => nav('scr-map'), 2000);
    }

    function emergencyReset() {
        if(confirm("全学習データを消去してリセットしますか？")) {
            localStorage.removeItem('eikenAetherFull');
            location.reload();
        }
    }

    function save() { localStorage.setItem('eikenAetherFull', JSON.stringify(state)); }

    window.onload = () => {
        updateHUD();
        loadGradeData(state.grade);
    };
</script>
</body>
</html>
