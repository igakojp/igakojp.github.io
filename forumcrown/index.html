<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum Crown • Home</title>
<link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon">
<meta name="description" content="Forum Crown is a powerful Discord bot for managing forums with automation, reactions, and stats.">
<style>
/* Global Styles */
body {
  font-family:'Segoe UI', Arial, sans-serif;
  margin:0; padding:0;
  background: linear-gradient(120deg,#0f1117,#161b22);
  color:#e6e6e6;
  overflow-x:hidden;
  opacity:0;
  transition: opacity 0.7s ease-in-out;
}
body.loaded { opacity:1; }

/* Hero Animation */
@keyframes gradientMove {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
header {
  text-align:center;
  padding:80px 20px;
  background:linear-gradient(120deg,#0f1117,#161b22);
  background-size:200% 200%;
  animation: gradientMove 15s ease infinite;
}
header h1 { font-size:50px;color:#58a6ff;margin:0; }
header p { font-size:18px;opacity:0.8;margin-top:10px; }

/* Navigation */
nav { text-align:center; padding:20px; margin-bottom:40px; }
nav a {
  color:#58a6ff;
  margin:0 20px;
  font-weight:bold;
  text-decoration:none;
  transition:all 0.3s;
}
nav a:hover { color:#1fb6ff; text-shadow:0 0 10px #1fb6ff; }

/* Buttons */
.btn {
  position:relative;
  display:inline-block;
  margin:20px;
  padding:15px 30px;
  font-size:16px;
  font-weight:bold;
  border-radius:12px;
  text-decoration:none;
  color:#0f1117;
  background:#58a6ff;
  box-shadow:0 0 10px #58a6ff70;
  overflow:hidden;
  transition:all 0.3s ease;
}
.btn:hover {
  transform:scale(1.05);
  box-shadow:0 0 25px #58a6ffcc;
}
.btn::before {
  content:'';
  position:absolute;
  top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.2);
  opacity:0;
  transition:opacity 0.3s;
}
.btn:hover::before { opacity:1; }

/* Section Fade */
.fade-section {
  opacity:0;
  transform:translateY(50px);
  transition:opacity 0.8s ease, transform 0.8s ease;
}
.fade-section.visible { opacity:1; transform:translateY(0); }

/* Container */
.container { text-align:center; max-width:1000px; margin:auto; padding:20px; }

/* Footer */
footer {
  text-align:center;
  padding:30px 10px;
  border-top:1px solid #30363d;
  opacity:0.7;
  font-size:14px;
}
</style>
</head>
<body>

<header class="fade-section">
<h1>Forum Crown</h1>
<p>Powerful Discord forum management bot</p>
</header>

<nav class="fade-section">
<a href="terms.html">Terms of Service</a>
<a href="privacy.html">Privacy Policy</a>
<a href="features.html">Features</a>
</nav>

<div class="container fade-section">
<p>Manage your Discord forums efficiently with automation, threads, reactions, and statistics.</p>
<a href="https://discord.com/oauth2/authorize?client_id=1373938165047496784" class="btn" data-tooltip="Invite Forum Crown to your server!">Add Bot</a>
<a href="https://discord.gg/yBP79TqqCr" class="btn" data-tooltip="Join our support server!">Support Server</a>
</div>

<footer class="fade-section">Forum Crown v1.0 | Operated by igakojp | All rights reserved | 2026</footer>

<script>
// Fade-in body
window.addEventListener('DOMContentLoaded',()=>{document.body.classList.add('loaded');});

// Scroll fade-in
const faders = document.querySelectorAll('.fade-section');
const observer = new IntersectionObserver((entries, obs)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){entry.target.classList.add('visible'); obs.unobserve(entry.target);}
  });
},{threshold:0.1});
faders.forEach(fader=>observer.observe(fader));
</script>

</body>
</html>
