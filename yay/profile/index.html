<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Yay! ユーザー情報</title>
  <script>
    /* This page answers every URL under profile/ (profile/user/123/album …), so relative
       links must always resolve against the profile/ folder, not the current deep path. */
    (function () {
      var h = location.href.split(/[?#]/)[0], i = h.lastIndexOf("/profile/");
      var base = i >= 0 ? h.slice(0, i + 9) : h.replace(/[^/]*$/, "");
      document.write('<base href="' + base.replace(/"/g, "%22") + '">');
      window.__profileBase = base;
    })();
  </script>
  <link rel="stylesheet" href="../yay-theme.css?v=20261124f">
  <link rel="stylesheet" href="profile.css?v=20261124f">
</head>
<body>
  <header class="topbar ys-topbar">
    <a class="brand" href="../index.html"><img class="brand-logo" src="https://yay.space/images/logotype.svg" alt="Yay!"><span><b>ユーザー情報</b></span></a>
    <form id="upHeadForm" class="yay-search" role="search" data-user-search><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><input name="q" placeholder="ユーザーを検索" aria-label="ユーザーを検索（ユーザーID、プロフィールURL、投稿URL）" autocomplete="off" enterkeyhint="search" spellcheck="false"></form>
    <a class="ys-tools-link" href="../index.html">ツール一覧</a>
  </header>
  <div class="ys-main">
    <div class="ys-container">
      <div id="upError" class="ys-error hidden" role="alert"></div>
      <div id="upApp" aria-live="polite"></div>
      <footer class="ys-footer"><span>Yay! ユーザー情報 · 公開情報のみ · ログイン不要</span><div id="creatorCredit" class="creator-credit" aria-live="polite">制作者情報を読み込み中…</div></footer>
    </div>
  </div>
  <div id="upModal" class="yay-modal hidden" role="dialog" aria-modal="true" aria-labelledby="upModalTitle"></div>
  <div id="upCall" class="ys-call-float hidden" aria-live="polite"></div>
  <div id="upLightbox" class="up-lightbox hidden" role="dialog" aria-modal="true" aria-label="メディアの拡大表示"></div>
  <script src="../yay-api.js?v=20261124f"></script>
  <script src="../site.js?v=20261124f"></script>
  <script src="profile.js?v=20261124f"></script>
</body>
</html>
